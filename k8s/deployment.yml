apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-backend-deployment
  labels:
    app: recipe-backend
spec:
  replicas: 3 # Múltiples réplicas para probar balanceo
  selector:
    matchLabels:
      app: recipe-backend
  template:
    metadata:
      labels:
        app: recipe-backend
    spec:
      containers:
      - name: backend
        image: placeholder-image:latest # El pipeline reemplazará esta imagen automáticamente
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: supabase-secrets
        env:
        - name: NODE_ENV
          value: "dev"
        - name: BACKEND_PORT
          value: "3001"
        - name: CORS_ORIGIN
          value: "http://localhost:3000"
        # Opcional: Inyectamos el nombre del Pod para que tu app pueda leerlo si lo deseas
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"