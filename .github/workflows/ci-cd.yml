name: CI Robusto

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: VALIDAR CÓDIGO (Lint + Test)
  # ==========================================
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    
    steps:
      # Paso 1: Descargar el código del repo
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para algunos análisis
      
      # Paso 2: Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # Cachea node_modules para speedup
      
      # Paso 3: Instalar dependencias
      - name: Instalar dependencias
        run: |
          cd app/backend
          npm ci  # ci = "clean install" (más determinístico que npm install)
      
      # Paso 4: ESLint - Verificar código limpio
      - name: Lint (ESLint)
        run: |
          cd app/backend
          npm run lint
      
      # Paso 5: Jest - Ejecutar tests
      - name: Tests (Jest)
        run: |
          cd app/backend
          npm run test
      
      # Paso 6: Gitleaks - Detectar secrets
      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # ==========================================
  # JOB 2: CONSTRUIR Y PUSHEAR IMAGEN
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    environment: dev
    needs: validate  # ← Solo corre si validate pasó

    outputs:
      version: ${{ steps.version.outputs.version }}
      image_name: ${{ vars.DOCKER_HUB_USERNAME }}/recipe-backend

    permissions:
      contents: read      # Para leer el código
      security-events: write # Para que Trivy/Gitleaks puedan subir resultados
      packages: write
    
    # Solo hacer push a docker hub en main, no en PRs
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      # Paso 1: Descargar código
      - name: Checkout código
        uses: actions/checkout@v4
      
      # Paso 2: Configurar acceso a Docker Hub
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      # Paso 3: Setup Docker Buildx (para builds optimizados)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Paso 4: Obtener versión (SemVer tagging)
      - name: Get version
        id: version
        run: |
          VERSION=$(cat app/backend/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_tag=recipe-backend:v${VERSION}" >> $GITHUB_OUTPUT
      
      # Paso 5: Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          dockerfile: ./Dockerfile
          push: false  # No pushear aún, primero scanear
          tags: ${{ steps.version.outputs.image_tag }}
          outputs: type=docker,dest=/tmp/image.tar
      
      # Paso 6: Escanear vulnerabilidades (Trivy)
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: '/tmp/image.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      # Paso 7: Upload reporte de Trivy
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      # Paso 8: Fallar si hay CRITICAL vulnerabilities
      - name: Check Trivy results
        run: |
          if grep -q '"ruleId": "CRITICAL' trivy-results.sarif; then
            echo "❌ CRITICAL vulnerabilities encontradas!"
            exit 1
          fi
      
      # Paso 9: Push image a Docker Hub
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          dockerfile: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/recipe-backend:v${{ steps.version.outputs.version }}
            ${{ vars.DOCKER_HUB_USERNAME }}/recipe-backend:latest
      
      # Paso 10: Notificación de éxito
      - name: Success notification
        if: success()
        run: |
          echo "✅ CI Pipeline completado exitosamente!"
          echo "📦 Imagen: ${{ vars.DOCKER_HUB_USERNAME }}/recipe-backend:v${{ steps.version.outputs.version }}"
# ==========================================
  # JOB 3: DEPLOY A KIND (Usando Self-Hosted Runner)
  # ==========================================
  deploy-to-kind:
    name: Deploy to Local Kind Cluster
    runs-on: self-hosted  # Corre en tu MacBook Pro
    environment: dev
    needs: build-and-push   # Espera a que la imagen esté segura en Docker Hub
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Pull Latest Image & Load into Kind
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_name }}:v${{ needs.build-and-push.outputs.version }}"
          
          echo "Pulling image: $IMAGE_TAG"
          docker pull $IMAGE_TAG
          
          echo "Loading image into kind cluster..."
          kind load docker-image $IMAGE_TAG --name kind

      - name: Create Kubernetes Secret from GitHub Secrets
        run: |
          echo "Creando o actualizando el secret de Supabase en el clúster..."
          
          # Borramos el secret si ya existe para asegurarnos de actualizarlo con los últimos valores
          kubectl delete secret supabase-secret --ignore-not-found=true
          
          # Creamos el secret en caliente usando los secrets de GitHub Actions
          kubectl create secret generic supabase-secret \
            --from-literal=VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --from-literal=VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            --from-literal=SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}"

      - name: Apply Kubernetes Manifests & Rollout
        run: |
          # Asegura que apunta al clúster correcto
          kubectl cluster-info
          
          # Aplica tus manifiestos (Deployment y Service)
          kubectl apply -f k8s/
          
          # Actualiza la imagen del deployment usando la versión exacta recién compilada
          kubectl set image deployment/recipe-backend-deployment backend=${{ needs.build-and-push.outputs.image_name }}:v${{ needs.build-and-push.outputs.version }}
          
          # Espera a que el rollout sea exitoso
          kubectl rollout status deployment/recipe-backend-deployment

      - name: Run E2E Integration Tests with Port-Forward
        run: |
          # 1. Iniciar port-forward en segundo plano hacia el puerto 3001
          echo "Iniciando port-forward a service/recipe-backend-service (3001:80)..."
          kubectl port-forward service/recipe-backend-service 3001:80 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!

          # 2. Asegurar que al finalizar el step (con éxito o error) se mate el proceso port-forward
          cleanup() {
            echo "Deteniendo port-forward (PID: $PF_PID)..."
            kill $PF_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          # 3. Esperar a que el puerto 3001 esté listo para responder (hasta 30 segundos)
          echo "Esperando que el backend responda en http://localhost:3001/health..."
          for i in {1..30}; do
            if curl -s -o /dev/null http://localhost:3001/health; then
              echo "✅ Backend respondiendo correctamente!"
              break
            fi
            sleep 1
          done

          # 4. Dar permisos de ejecución y correr el script de pruebas
          chmod +x app/backend/test.sh
          ./app/backend/test.sh

      - name: Run E2E Integration Tests with Port-Forward
        run: |
          # 1. Iniciar port-forward en segundo plano hacia el puerto 3001
          echo "Iniciando port-forward a deployment/recipe-backend-service (3001:3001)..."
          kubectl port-forward deployment/recipe-backend-service 3001:3001 > /tmp/port-forward.log 2>&1 &
          PF_PID=$!

          # 2. Asegurar que al finalizar el step (con éxito o error) se mate el proceso port-forward
          cleanup() {
            echo "Deteniendo port-forward (PID: $PF_PID)..."
            kill $PF_PID 2>/dev/null || true
          }
          trap cleanup EXIT

          # 3. Esperar a que el puerto 3001 esté listo para responder (hasta 30 segundos)
          echo "Esperando que el backend responda en http://localhost:3001/health..."
          for i in {1..30}; do
            if curl -s -o /dev/null http://localhost:3001/health; then
              echo "✅ Backend respondiendo correctamente!"
              break
            fi
            sleep 1
          done

          # 4. Dar permisos de ejecución y correr el script de pruebas
          chmod +x app/backend/test.sh
          ./app/backend/test.sh
